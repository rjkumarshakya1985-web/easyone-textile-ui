<div class="login-container">
  <section class="login-hero" aria-label="SC Jain Sarees">
    <img class="hero-logo" src="/assets/jain-sarees-login.png" alt="SC Jain Sarees Pvt Ltd" />
    <p class="brand-copy">Secure business workspace for day-to-day operations.</p>
  </section>

  <div class="login-divider" aria-hidden="true"></div>

  <div class="login-card p-shadow-5 p-d-flex p-flex-column">
    <div class="login-header">
      <span class="login-badge"><i class="pi pi-shield"></i></span>
      <div>
        <h2>Welcome back</h2>
        <p>Sign in to continue</p>
      </div>
    </div>

    <div class="p-field inline-field">
      <label for="username">Username</label>
      <div class="input-control">
        <i class="pi pi-user" aria-hidden="true"></i>
        <input id="username" type="text" pInputText [(ngModel)]="username" placeholder="Enter username"
          autocomplete="username" (keyup.enter)="login()" />
      </div>
    </div>

    <div class="p-field inline-field">
      <label for="password">Password</label>
      <div class="input-control">
        <i class="pi pi-lock" aria-hidden="true"></i>
        <input id="password" type="password" pInputText [(ngModel)]="password" placeholder="Enter password"
          autocomplete="current-password" (keyup.enter)="login()" />
      </div>
    </div>

    <div class="p-field-checkbox">
      <p-checkbox [(ngModel)]="rememberMe" inputId="rememberMe"></p-checkbox>
      <label for="rememberMe">Remember me</label>
    </div>

    <div>
      <button pButton type="button" class="p-button-success login-button" (click)="login()">
        <span>Login</span>
        <i class="pi pi-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>

<p-toast></p-toast>
