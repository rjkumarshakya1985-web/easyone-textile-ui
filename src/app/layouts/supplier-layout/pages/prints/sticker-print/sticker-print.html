<p-toolbar class="page-header">
  <div class="p-toolbar-group-left">
    <p-breadcrumb [model]="breadcrumbItems" homeIcon="pi pi-home"></p-breadcrumb>
  </div>

  <div class="p-toolbar-group-right">
    <p-button
      label="Print"
      icon="pi pi-print"
      severity="success"
      (click)="printSticker('sticker-print-section')">
    </p-button>
    <p-button class="ml-2"
      label="Back"
      icon="pi pi-arrow-left"
      severity="secondary"
      (click)="back()" >
    </p-button>
  </div>
</p-toolbar>

<p-card *ngIf="printData() as sticker">
  <div id="sticker-print-section">
  <div style="width:260px;border:1px solid #e0e0e0;border-radius:12px;padding:10px">

    <!-- Header -->
    <div style="display:flex;justify-content:space-between;font-size:14px">
      <b>SSBD</b>
      <small>{{ sticker.printDateString }}</small>
    </div>

    <!-- Product -->
    <div style="font-size:11px">
      {{ sticker.productName }}/{{ sticker.supplierCode }}
    </div>

    <!-- MRP -->
    <div style="font-size:14px;font-weight:bold">
      MRP Rs. {{ sticker.mrpRate }}/-
    </div>

    <!-- Rates -->
    <div style="display:flex;justify-content:space-between;font-size:11px">
      <span>{{ sticker.wholeSaleRate }}</span>
      <span>{{ sticker.retailRate }}</span>
    </div>

    <!-- Barcode -->
    <div style="text-align:center">
      <ngx-barcode6
        [bc-value]="sticker.barcode"
        [bc-format]="'CODE128'"
        [bc-width]="3"
        [bc-height]="32"
        [bc-display-value]="true">
      </ngx-barcode6>
    </div>

  </div>
  </div>
</p-card>
