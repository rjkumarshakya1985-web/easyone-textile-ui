<section class="force-password-page">
  <div class="password-card">
    <div class="password-icon">
      <i class="pi pi-lock"></i>
    </div>

    <div class="password-heading">
      <span>Security Required</span>
      <h1>Set your password</h1>
      <p>Your account was opened using the supplier code. Please create a password before continuing.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="password-form">
      <label>
        <span>Current code / password</span>
        <input pInputText type="password" formControlName="oldPassword" autocomplete="current-password" />
        <small class="field-error" *ngIf="form.controls.oldPassword.touched && form.controls.oldPassword.hasError('required')">
          Current code or password is required.
        </small>
      </label>

      <label>
        <span>New password</span>
        <input pInputText type="password" formControlName="newPassword" autocomplete="new-password" />
        <small class="field-error" *ngIf="form.controls.newPassword.touched && form.controls.newPassword.hasError('required')">
          New password is required.
        </small>
        <small class="field-error" *ngIf="form.controls.newPassword.touched && form.controls.newPassword.hasError('minlength')">
          New password must be at least 4 characters.
        </small>
      </label>

      <label>
        <span>Confirm password</span>
        <input pInputText type="password" formControlName="confirmPassword" autocomplete="new-password" />
        <small class="field-error" *ngIf="form.controls.confirmPassword.touched && form.controls.confirmPassword.hasError('required')">
          Confirm password is required.
        </small>
        <small class="field-error" *ngIf="form.controls.confirmPassword.touched && form.controls.confirmPassword.value && form.controls.newPassword.value !== form.controls.confirmPassword.value">
          Confirm password must match new password.
        </small>
      </label>

      <button pButton type="submit" icon="pi pi-check" label="Save Password" class="save-button"></button>
    </form>
  </div>
</section>

<p-toast></p-toast>
