<p-toolbar class="page-header">
  <div class="p-toolbar-group-left">
    <p-breadcrumb [model]="breadcrumbItems" homeIcon="pi pi-home"></p-breadcrumb>
  </div>

  <div class="p-toolbar-group-right">
    <p-button label="Add Product" class="p-button-sm mr-2"  variant="text" [raised]="true" icon="pi pi-plus" (click)="goToAddProduct()"/>
    <p-button label="Export" variant="text" icon="pi pi-file-export" [raised]="true" severity="secondary" />
  </div>
</p-toolbar>

<p-card class="app-list-page supplier-product-page">
    <div class="d-flex justify-content-between mb-3">

      <div class="flex-grow-1" style="max-width:300px">
        <p-floatlabel variant="on">
          <input pInputText id="on_label" [formControl]="searchControl" autocomplete="off" />
          <label for="on_label">Search keyword</label>
        </p-floatlabel>
      </div>

      <ng-container>
        <p-buttonGroup>
          <p-menu #menuItem [model]="pageSizeItems" [popup]="true" />
          <p-button (click)="menuItem.toggle($event)" label="{{pageSize}}" outlined severity="secondary"></p-button>
          <p-button label="Total ({{tblResult().totalRows}})" disabled outlined></p-button>

          <p-button icon="pi pi-angle-left"
            outlined (click)="onPrevious()"></p-button>

          <p-button label="{{ pageindex() + 1 }}/{{ numberofPage() }}"
            disabled outlined></p-button>

          <p-button icon="pi pi-angle-right"
            outlined (click)="onNext()"></p-button>
        </p-buttonGroup>
      </ng-container>

    </div>

    <!-- TABLE -->
    <ng-container>
      <p-table #dt1 [value]="tblResult().result" [lazy]="true"
       (onLazyLoad)="onLazyLoad($event)"
       [sortField]="sortField" [lazyLoadOnInit]="false"
       [sortOrder]="sortOrder" size="small" styleClass="supplier-product-table">

        <ng-template pTemplate="header">
          <tr>
             <th>
                <i class="pi pi-filter-slash cursor-pointer" (click)="clear(dt1)"></i>
            </th>
            <th pSortableColumn="stockGroupName">
               <div class="supplier-header">
                    <span class="header-title">Category</span>&nbsp;
                    <p-sortIcon field="stockGroupName"></p-sortIcon>
                </div>
            </th>
            <th pSortableColumn="name">
               <div  class="flex align-items-center gap-2">
                    <span class="header-title">Name</span>&nbsp;
                    <p-sortIcon field="name"></p-sortIcon>
                      <p-columnFilter 
                        type="text"
                        field="name"
                        display="menu"
                        matchMode="equals"
                        [showMatchModes]="false"
                        [showOperator]="false"
                       [showAddButton]="false">
                    </p-columnFilter>
                </div>
            </th>
            <th pSortableColumn="printName">
               <div  class="flex align-items-center gap-2">
                    <span class="header-title">Print Name</span>&nbsp;
                    <p-sortIcon field="printName"></p-sortIcon>
                    <p-columnFilter 
                        type="text"
                        field="printName"
                        display="menu"
                        matchMode="equals"
                        [showMatchModes]="false"
                        [showOperator]="false"
                       [showAddButton]="false">
                    </p-columnFilter>
                </div>
            </th>
             <th pSortableColumn="barcode">
                   <div  class="flex align-items-center gap-2">
                    <span class="header-title">Barcode</span>&nbsp;
                    <p-sortIcon field="barcode"></p-sortIcon>
                    <p-columnFilter 
                        type="text"
                        field="barcode"
                        display="menu"
                        matchMode="equals"
                        [showMatchModes]="false"
                        [showOperator]="false"
                       [showAddButton]="false">
                    </p-columnFilter>
                </div>
            </th>
             <th pSortableColumn="hsnCode">
               <div class="supplier-header">
                    <span class="header-title">Hsn Code</span>&nbsp;
                    <p-sortIcon field="hsnCode"></p-sortIcon>
                </div>
            </th>
            <th class="text-end">Purchase Rate</th>
            <th class="text-center">Gst %</th>
            <th class="action-column">Action</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
          <tr [ngClass]="{ 'inactive-row': !row.isActive }">
            <td class="filter-cell"></td>
            <td><span class="category-chip">{{row.stockGroupName || 'Unassigned'}}</span></td>
            <td><span class="product-name">{{ row.name }}</span></td>
            <td><span class="print-name">{{row.printName || '-'}}</span></td>
            <td><span class="barcode-pill">{{row.barcode || '-'}}</span></td>
            <td><span class="hsn-pill">{{row.hsnCode || '-'}}</span></td>
            <td class="text-end"><span class="rate-value">{{row.purchaseRate | currency:'INR':'symbol':'1.2-2'}}</span></td>
            <td class="text-center"><span class="gst-pill">{{row.discount}}%</span></td>
            <td class="action-column">
               <span class="supplier-action"
                 (click)="openMenu($event, row)" pTooltip="Actions">
                  <i class="pi pi-ellipsis-v"></i>
               </span>
            </td>
          </tr>
        </ng-template>

      </p-table>
    </ng-container>

</p-card>

<p-menu #menu [model]="items" [popup]="true"></p-menu>
<p-confirmDialog></p-confirmDialog>
