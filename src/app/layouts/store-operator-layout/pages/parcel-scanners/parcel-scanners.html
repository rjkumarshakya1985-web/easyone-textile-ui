<p-toolbar class="page-header">
  <div class="p-toolbar-group-left">
    <div class="flex flex-col gap-2">
      <i class="pi pi-question-circle" style="font-size: 24px;"
     [pTooltip]="helpTooltip"
  tooltipPosition="right"></i>
      <label>Parcel Number</label>

      <input  #parcelInput
        pInputText
        [ngModel]="parcelNumber()"
        (ngModelChange)="parcelNumber.set($event)"
        (keyup.enter)="onEnter()" />


    </div>
  </div>
  <div class="p-toolbar-group-right">
    <p-button [label]="actionButtonLabel" class="p-button-sm mr-2"  variant="text" [raised]="true" (click)="parcelReceived()"/>
  </div>
</p-toolbar>

<div class="card">
  <p-table
    [value]="parcels()"
    [loading]="isLoading()"
    dataKey="saleVoucherId"
    [tableStyle]="{'min-width': '50rem'}">

    <ng-template #header>
      <tr>
        <th style="width: 4rem;">#</th>
        <th>Parcel No.</th>
        <th>Transport</th>
        <th>Supplier</th>
        <th>Supplier Bill No</th>
        <th>Qty</th>
        <th>Products</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </ng-template>

    <ng-template #body let-p let-i="rowIndex">
      <tr>
        <td>{{ i + 1 }}</td>
        <td>{{ p.saleVoucherId }}</td>
        <td>{{ p.transporterName }}</td>
        <td>{{ p.supplierName }}</td>
        <td>{{ p.supplierBillNumber }}</td>
        <td>{{p.quantity}}</td>
        <td>{{p.products}}</td>
        <td>{{p.status}}</td>
        <td>
              <span class="px-2 py-1 rounded bg-red-50 text-red-600 cursor-pointer hover:bg-red-100 ml-2"
                 pTooltip="Delete" (click)="remove(p.saleVoucherId)">
                 <i class="pi pi-trash"></i>
               </span>
        </td>
      </tr>
    </ng-template>

  </p-table>
</div>
