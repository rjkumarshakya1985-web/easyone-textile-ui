<p-toolbar class="page-header">
  <div class="p-toolbar-group-left">
    <p-breadcrumb [model]="breadcrumbItems" homeIcon="pi pi-home"></p-breadcrumb>
  </div>

  <!-- <div class="p-toolbar-group-right">
    <p-button label="Add Product" class="p-button-sm mr-2"  variant="text" [raised]="true" icon="pi pi-plus" (click)="goToAddProduct()"/>
    <p-button label="Export" variant="text" icon="pi pi-file-export" [raised]="true" severity="secondary" />
  </div> -->
</p-toolbar>

<p-card>
    <div class="d-flex justify-content-between mb-3">

      <div class="flex-grow-1" style="max-width:300px">
        <p-floatlabel variant="on">
          <input pInputText id="on_label" [formControl]="searchControl" autocomplete="off" />
          <label for="on_label">Search keyword</label>
        </p-floatlabel>
      </div>

      <ng-container *ngIf="isLoading()">
        <p-buttonGroup>
          <p-menu #menuItem [model]="pageSizeItems" [popup]="true" />
          <p-button (click)="menuItem.toggle($event)" label="{{pageSize}}" outlined severity="secondary"></p-button>
          <p-button label="Total ({{tblResult().totalRows}})" disabled outlined></p-button>

          <p-button icon="pi pi-angle-left"
            outlined (click)="onPrevious()"></p-button>

          <p-button label="{{ pageindex() + 1 }}/{{ numberofPage() }}"
            disabled outlined></p-button>

          <p-button icon="pi pi-angle-right"
            outlined (click)="onNext()"></p-button>
        </p-buttonGroup>
      </ng-container>

    </div>

    <!-- TABLE -->
    <ng-container *ngIf="isLoading()">
      <p-table [value]="tblResult().result" [lazy]="true"
  (onLazyLoad)="onLazyLoad($event)"
  [sortField]="sortField" [lazyLoadOnInit]="false"
  [sortOrder]="sortOrder" size="small" showGridlines class="p-datatable-sm">

        <ng-template pTemplate="header">
          <tr>
        <th pSortableColumn="supplierName">
          <div class="supplier-header">
              <span class="header-title">Supplier</span>&nbsp;
              <p-sortIcon field="supplierName"></p-sortIcon>
         <!-- 
    <p-columnFilter
      field="supplierName"
      display="menu"
      matchMode="contains"
      [showMatchModes]="false"
      [showOperator]="false"
      [showAddButton]="false"
      styleClass="supplier-filter">

      <ng-template pTemplate="filter" let-value let-filter="filterCallback">
        <div class="filter-input">
          <i class="pi pi-search"></i>
          <input
            pInputText
            type="text"
            [value]="value"
            (input)="filter($event.target.value)"
            placeholder="Search supplier">
        </div>
      </ng-template>

    </p-columnFilter> -->
          </div>
       </th>
        <th pSortableColumn="CategoryName">
                    <div class="flex items-center gap-2">Category name
                        <p-sortIcon field="CategoryName" />
                    </div>
        </th>
         <th pSortableColumn="name">
                    <div class="flex items-center gap-2">Product Name
                        <p-sortIcon field="name" />
                    </div>
        </th>
        <th pSortableColumn="printName">
                    <div class="flex items-center gap-2">Print Name
                        <p-sortIcon field="printName" />
                    </div>
        </th>
        <th pSortableColumn="barcode">
                    <div class="flex items-center gap-2">Barcode
                        <p-sortIcon field="barcode" />
                    </div>
        </th>
        
        <th pSortableColumn="hsnCode">
                    <div class="flex items-center gap-2">Hsn Code
                        <p-sortIcon field="hsnCode" />
                    </div>
        </th>
         <th pSortableColumn="purchaseRate">
                    <div class="flex items-center gap-2">Purchase Rate
                        <p-sortIcon field="purchaseRate" />
                    </div>
        </th>
            <th>Discount</th>
            <th>Action</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
          <tr [ngClass]="{ 'inactive-row': !row.isActive }">
            <td>{{row.supplierName}}</td>
            <td>{{row.stockGroupName}}</td>
            <td>{{ row.name }}</td>
            <td>{{row.printName}}</td>
            <td>{{row.barcode}}</td>
            <td>{{row.hsnCode}}</td>
            <td>{{row.purchaseRate}}</td>
            <td>{{row.discount}}</td>
            <td>
               <span class="px-2 py-1 rounded bg-blue-50 text-blue-600 cursor-pointer hover:bg-blue-100"
                 (click)="openMenu($event, row)" pTooltip="Actions">
                  <i class="pi pi-ellipsis-v"></i>
               </span>
            </td>
          </tr>
        </ng-template>

      </p-table>
    </ng-container>

</p-card>

<p-menu #menu [model]="items" [popup]="true"></p-menu>
<p-confirmDialog></p-confirmDialog>
