<p-toolbar class="page-header">
  <div class="p-toolbar-group-left">
    <p-breadcrumb [model]="breadcrumbItems" homeIcon="pi pi-home"></p-breadcrumb>
  </div>

  <div class="p-toolbar-group-right">
    
    <p-button label="Add Transport" class="p-button-sm mr-2"  variant="text" [raised]="true" icon="pi pi-plus" (click)="goToAddTransport()"/>
   <p-button label="Export" variant="text" icon="pi pi-file-export" [raised]="true" severity="secondary" />
  </div>
</p-toolbar>

<p-card class="app-list-page">
    <div class="d-flex justify-content-between mb-3">

      <div class="flex-grow-1" style="max-width:300px">
         <p-floatlabel variant="on">
          <input pInputText id="on_label" [formControl]="searchControl" autocomplete="off" />
          <label for="on_label">Search keyword</label>
        </p-floatlabel>
      </div>

      <ng-container *ngIf="isLoading()">
         <p-buttonGroup>
         <p-menu #menuItem [model]="pageSizeItems" [popup]="true" />
          <p-button (click)="menuItem.toggle($event)" label="{{pageSize}}" outlined severity="secondary"></p-button>        
          <p-button label="Total ({{tblResult().totalRows}})" disabled outlined></p-button>

          <p-button icon="pi pi-angle-left"
            outlined (click)="onPrevious()" severity="secondary"></p-button>

          <p-button label="{{ pageindex() + 1 }}/{{ numberofPage() }}"
            disabled outlined severity="secondary"></p-button>

          <p-button icon="pi pi-angle-right"
            outlined (click)="onNext()" severity="secondary"></p-button>
        </p-buttonGroup>
      </ng-container>

    </div>

    <!-- TABLE -->
    <ng-container *ngIf="isLoading()">
     <p-table [value]="tblResult().result" [lazy]="true"
  (onLazyLoad)="onLazyLoad($event)"
  [sortField]="sortField" [lazyLoadOnInit]="false"
  [sortOrder]="sortOrder" size="small" showGridlines class="p-datatable-sm">

        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="name">
          <div class="supplier-header">
              <span class="header-title">Name</span>&nbsp;
              <p-sortIcon field="name"></p-sortIcon>
                 </div>
       </th>
         <th pSortableColumn="transportType">
          <div class="supplier-header">
              <span class="header-title">Transport Type</span>&nbsp;
              <p-sortIcon field="transportType"></p-sortIcon>
                 </div>
       </th>
             <th pSortableColumn="city">
          <div class="supplier-header">
              <span class="header-title">City</span>&nbsp;
              <p-sortIcon field="city"></p-sortIcon>
                 </div>
       </th>
            <th pSortableColumn="state">
          <div class="supplier-header">
              <span class="header-title">State</span>&nbsp;
              <p-sortIcon field="state"></p-sortIcon>
                 </div>
       </th>    
       <th pSortableColumn="gstin">
          <div class="supplier-header">
              <span class="header-title">GSTIN</span>&nbsp;
              <p-sortIcon field="gstin"></p-sortIcon>
                 </div>
       </th>     
       <th pSortableColumn="registrationType">
          <div class="supplier-header">
              <span class="header-title">Reg. Type</span>&nbsp;
              <p-sortIcon field="registrationType"></p-sortIcon>
                 </div>
       </th>        
             <th pSortableColumn="mobile">
          <div class="supplier-header">
              <span class="header-title">Mobile</span>&nbsp;
              <p-sortIcon field="mobile"></p-sortIcon>
                 </div>
       </th>  <th pSortableColumn="email">
          <div class="supplier-header">
              <span class="header-title">Email</span>&nbsp;
              <p-sortIcon field="email"></p-sortIcon>
                 </div>
       </th> 
            <th class="action-column">Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
          <tr>
            <td>{{ row.name }}</td>
            <td>{{getTransportTypeText(row.transportType)}}</td>
            <td>{{ row.city }}</td>
            <td>{{ row.state }}</td>
            <td>{{ row.gstin || '-' }}</td>
            <td>{{ getRegTypeText(row.registrationType) }}</td>
            <td>{{ row.mobile }}</td>
            <td>{{ row.email || '-' }}</td>
            <td class="action-column">
              <span class="px-2 py-1 rounded bg-blue-50 text-blue-600 cursor-pointer hover:bg-blue-100"
                (click)="openMenu($event, row)" pTooltip="Actions">
                <i class="pi pi-ellipsis-v"></i>
              </span>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="9">
              <div class="table-empty-state">
                <i class="pi pi-inbox"></i>
                <span>No records found</span>
              </div>
            </td>
          </tr>
        </ng-template>

      </p-table>
    </ng-container>

</p-card>
<p-menu #menu [model]="items" [popup]="true"></p-menu>
<p-confirmDialog></p-confirmDialog>
