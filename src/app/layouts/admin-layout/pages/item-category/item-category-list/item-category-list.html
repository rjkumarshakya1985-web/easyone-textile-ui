<p-toolbar class="page-header">
  <div class="p-toolbar-group-left">
    <p-breadcrumb [model]="breadcrumbItems" homeIcon="pi pi-home"></p-breadcrumb>
  </div>

  <div class="p-toolbar-group-right">
   <p-button label="Add Product Category" class="p-button-sm mr-2"  variant="text" [raised]="true" icon="pi pi-plus" (click)="showDialog()"/>
   <p-button label="Export" variant="text" icon="pi pi-file-export" [raised]="true" severity="secondary" />
  </div>
</p-toolbar>

<p-card>
    <!-- TABLE -->
    <ng-container *ngIf="isLoading()">
        <p-table [value]="tableData()" showGridlines class="p-datatable-sm">

        <ng-template pTemplate="header">
          <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Gst%</th>
            <th>Gst Rule</th>
            <th class="text-center action-column">Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
          <tr [ngClass]="{ 'inactive-row': !row.isActive }">
            <td>{{ row.name }}</td>
            <td>{{row.description || '-'}}</td>
            <td>{{ row.gstValue}}</td>
            <td>{{ row.isGstRule ? 'Applicable' : 'Not Applicable' }}</td>
            <td class="text-center action-column">
              <span class="px-2 py-1 rounded bg-blue-50 text-blue-600 cursor-pointer hover:bg-blue-100"
                (click)="openMenu($event, row)" pTooltip="Actions">
                <i class="pi pi-ellipsis-v"></i>
              </span>
          </td>
          </tr>
        </ng-template>

      </p-table>
    </ng-container>
</p-card>
<p-menu #menu [model]="items" [popup]="true"></p-menu>


<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '28rem' }"
  header="Stock Group">

  <form [formGroup]="stockGroupForm" class="p-fluid">

    <div class="row g-3">

      <!-- Name -->
      <div class="col-12">
        <p-floatLabel variant="on">
          <input
            pInputText
            id="sg_name"
            formControlName="name"
            class="w-full"
            [ngClass]="{
              'ng-invalid ng-dirty':
                stockGroupForm.get('name')?.invalid &&
                stockGroupForm.get('name')?.touched
            }" />
          <label for="sg_name">Name</label>
        </p-floatLabel>
      </div>

      <!-- GST Value -->
      <div class="col-12">
        <p-floatLabel variant="on">
          <p-inputNumber
            inputId="sg_gstValue"
            formControlName="gstValue"
            mode="decimal"
            [minFractionDigits]="0"
            [maxFractionDigits]="0"
            class="w-full"
            [ngClass]="{
              'ng-invalid ng-dirty':
                stockGroupForm.get('gstValue')?.invalid &&
                stockGroupForm.get('gstValue')?.touched
            }">
          </p-inputNumber>
          <label for="sg_gstValue">GST %</label>
        </p-floatLabel>
      </div>

      <!-- Description -->
      <div class="col-12">
        <p-floatLabel variant="on">
          <textarea
            pTextarea
            id="sg_desc"
            rows="3"
            formControlName="description"
            class="w-full"
            style="resize: none">
          </textarea>
          <label for="sg_desc">Description</label>
        </p-floatLabel>
      </div>

      <!-- Gst Rule -->  
     <div class="col-4 flex items-center">
        <p-checkbox
          binary="true"
          inputId="sg_isgstrule"
          formControlName="isGstRule">
        </p-checkbox>
        <label for="sg_isgstrule" class="ml-2">Gst Rule</label>
    </div>
      <!-- Active -->
      <div class="col-8 flex items-center">
        <p-checkbox
          binary="true"
          inputId="sg_active"
          formControlName="isActive">
        </p-checkbox>
        <label for="sg_active" class="ml-2">Active</label>
      </div>

    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button
      label="Cancel"
      severity="secondary"
      (click)="visible = false" />

    <p-button
      label="Save"
      severity="info"
      (click)="saveStockGroup()" />
  </ng-template>

</p-dialog>
