<div class="container mt-4">
  <form [formGroup]="supplierForm" (ngSubmit)="submit()">

    <div class="card">
     <div class="card-header flex items-center">
     <span class="text-lg font-semibold" style="margin-top: 16px;">Supplier Information</span>
       <p-button type="submit"
        label="Save Supplier" 
        class="p-button-sm ml-auto"  
        variant="text" 
        [raised]="true">
      </p-button>
    </div>
      <div class="card-body">

         <div class="row g-3">
           
          <div class="col-md-3">
            <p-floatlabel class="w-full md:w-56" variant="on">
                <p-select formControlName="departmentId" inputId="department"
                 [options]="(department$ | async) ?? []" optionLabel="name" optionValue="id" class="w-full"
                 (onChange)="onDepartmentChange($event)" 
                  [ngClass]="{ 'ng-invalid ng-dirty': supplierForm.get('departmentId')?.invalid && supplierForm.get('departmentId')?.touched }" ></p-select>
                <label for="department">Select Department</label>
             </p-floatlabel>
          </div>

          <div class="col-md-3">
            <p-floatlabel class="w-full md:w-56" variant="on">
                <p-select formControlName="subDepartmentId"  inputId="subDepartment" [options]="(subDepartment$ | async) ?? []" optionLabel="name" optionValue="id" class="w-full" 
                            [ngClass]="{ 'ng-invalid ng-dirty': supplierForm.get('subDepartmentId')?.invalid && supplierForm.get('subDepartmentId')?.touched }"  ></p-select>
                <label for="subDepartment">Select Sup Department</label>
             </p-floatlabel>
          </div>

           <div class="col-md-3">
             <div class="w-full">
                <p-autocomplete
                   formControlName="agentObj"
                   [suggestions]="filteredAgents()"
                   (completeMethod)="searchAgent($event)"
                   optionLabel="name"
                   placeholder="Search Agent"
                   appendTo="body"
                   [forceSelection]="true"
                   styleClass="w-full"
                   inputStyleClass="w-full"
                   [ngClass]="{
                 'ng-invalid ng-dirty':
                  supplierForm.get('agentObj')?.invalid &&
                  supplierForm.get('agentObj')?.touched}">

        <ng-template let-agent pTemplate="item">
         <div style="display: flex; flex-direction: column;">
            <span style="font-weight: 500;">{{ agent.name }}</span>
         </div>
       </ng-template>

       <ng-template pTemplate="header">
        <div class="font-medium px-3 py-2">Select Agent</div>
      </ng-template>
                </p-autocomplete>
                <small class="text-red-500"
                 *ngIf="supplierForm.get('agentObj')?.invalid &&
                      supplierForm.get('agentObj')?.touched">
                 
               </small>
             </div>
           </div>


          <div class="col-md-3">
            <p-floatlabel variant="on">
              <input pInputText  class="form-control" id="on_Supplier_userName" formControlName="userName"  autocomplete="off"
               [ngClass]="{ 'ng-invalid ng-dirty': supplierForm.get('userName')?.invalid && supplierForm.get('userName')?.touched }"  />
              <label for="on_Supplier_userName">User Name</label>
            </p-floatlabel>
          </div>

        

          <!-- Name -->
          <div class="col-md-3">
            <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Supplier_name" formControlName="name"  autocomplete="off"
               [ngClass]="{ 'ng-invalid ng-dirty': supplierForm.get('name')?.invalid && supplierForm.get('name')?.touched }"  />
              <label for="on_Supplier_name">Name</label>
            </p-floatlabel>
          </div>

          <!-- Alias -->
          <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Supplier_alias" formControlName="alias" autocomplete="off" />
              <label for="on_Supplier_alias">Alias</label>
            </p-floatlabel>
           
          </div>

           <div class="col-md-3">
            <p-floatlabel variant="on">
              <input pInputText class="form-control"  id="on_Supplier_code" formControlName="code"  autocomplete="off"
              [ngClass]="{ 'ng-invalid ng-dirty': supplierForm.get('code')?.invalid && supplierForm.get('code')?.touched }"  />
              <label for="on_Supplier_code">Code</label>
            </p-floatlabel>
          </div>

       

          <!-- Registration Type -->
          <div class="col-md-3">
            <p-floatlabel class="w-full md:w-56" variant="on">
             <p-select
                 formControlName="regType"
                 inputId="on_Supplier_registrationTypes"
                 [options]="registrationTypes"
                 optionLabel="name"
                class="w-full" optionValue="value">
              </p-select>
             <label for="on_Supplier_registrationTypes">Registration type</label>
          </p-floatlabel>
         </div>

          <!-- City, State, Pin -->
          <div class="col-md-3">
             <p-floatlabel class="w-full md:w-56" variant="on">
                <p-select formControlName="stateId" inputId="state" [options]="(states$ | async) ?? []" optionLabel="name" optionValue="id" (onChange)="onStateChange($event)" class="w-full" />
                <label for="state">Select State</label>
             </p-floatlabel>
          </div>

          <div class="col-md-3">
            <p-floatlabel class="w-full md:w-56" variant="on">
                <p-select formControlName="cityId" inputId="city" [options]="(cities$ | async) ?? []" optionLabel="name" optionValue="id"  class="w-full" 
                 />
                <label for="city">Select City</label>
             </p-floatlabel>
          </div>
          
          <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Supplier_contactPerson" formControlName="contactPerson" autocomplete="off"
              [ngClass]="{ 'ng-invalid ng-dirty': supplierForm.get('contactPerson')?.invalid && supplierForm.get('contactPerson')?.touched }"  />
              <label for="on_Supplier_contactPerson">Contact Person</label>
            </p-floatlabel>
          </div>

          <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Supplier_mobile" formControlName="mobile" autocomplete="off" 
               [ngClass]="{ 'ng-invalid ng-dirty': supplierForm.get('mobile')?.invalid && supplierForm.get('mobile')?.touched }"  />
              <label for="on_Supplier_mobile">Mobile</label>
            </p-floatlabel>
          </div>

           <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Supplier_email" formControlName="email" autocomplete="off" />
              <label for="on_Supplier_email">Email</label>
            </p-floatlabel>
          </div>

           <!-- Price Type -->
          
         
          
          <!-- Margins -->
          <!-- GSTIN -->
          <div class="col-md-3">
            <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Supplier_gstIn" formControlName="gstIn" autocomplete="off" 
              [ngClass]="{ 'ng-invalid ng-dirty': supplierForm.get('gstIn')?.invalid && supplierForm.get('gstIn')?.touched }" />
              <label for="on_Supplier_gstIn">GSTIN</label>
            </p-floatlabel>
          </div>

           <div class="col-md-3">
            <p-floatlabel variant="on">
                <p-datepicker  inputId="on_Supplier_gstRegistrationDate"  formControlName="gstRegistrationDate" showIcon iconDisplay="input" />
                <label for="on_Supplier_gstRegistrationDate">Gst Registration Date</label>
            </p-floatlabel>
          </div>
         <!-- PAN -->
          <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Supplier_pan" formControlName="pan" autocomplete="off" />
              <label for="on_Supplier_pan">PAN</label>
            </p-floatlabel>
          </div>
           <!-- Address -->
          <div class="col-md-12">
             <p-floatlabel variant="on">
              <textarea class="form-control"  pTextarea id="on_address" fluid formControlName="address" rows="3" cols="30" style="resize: none" class="h-full"
              [ngClass]="{ 'ng-invalid ng-dirty': supplierForm.get('address')?.invalid && supplierForm.get('address')?.touched }"></textarea>
              <label for="on_address">Address</label>
            </p-floatlabel>
          </div>

        </div>
      </div>
    </div>
    <div class="card mt-3">
       <div class="card-header flex items-center">
       <span class="text-lg font-semibold" style="margin-top: 16px;">Discount and Margin Info:</span>
      </div>
      <div class="card-body">
         <div class="row g-3">
            <div class="col-md-3">
              <p-floatlabel class="w-full md:w-56" variant="on">
                <p-select formControlName="discountType" inputId="dtype" [options]="discountTypes" optionValue="value" optionLabel="name" class="w-full" 
                 [ngClass]="{ 'ng-invalid ng-dirty': supplierForm.get('discountType')?.invalid && supplierForm.get('discountType')?.touched }"/>
                <label for="dtype">Discount Type</label>
              </p-floatlabel>
           </div>

           <div class="col-md-3">
              <p-floatlabel variant="on">
                <p-inputNumber
                    inputId="on_Supplier_billDiscount"
                    formControlName="billDiscount"
                    [min]="0"
                    [ngClass]="{ 'ng-invalid ng-dirty': supplierForm.get('billDiscount')?.invalid && supplierForm.get('billDiscount')?.touched }"
                    [minFractionDigits]="0"
                    [maxFractionDigits]="2"
                    autocomplete="off"
                    class="w-full">
                </p-inputNumber>
                <label for="on_Supplier_billDiscount">Discount</label>
              </p-floatlabel>
           </div>

          

     
       <div class="col-md-3">
              <p-floatlabel variant="on">
               <p-inputNumber
                inputId="on_Supplier_wholesaleMargin"
                formControlName="wholeSalesMargin"
                mode="decimal"
               [minFractionDigits]="0"
               [maxFractionDigits]="0"
               [ngClass]="{ 'ng-invalid ng-dirty': supplierForm.get('wholeSalesMargin')?.invalid && supplierForm.get('wholeSalesMargin')?.touched }">
              </p-inputNumber>
              <label for="on_Supplier_wholesaleMargin">Wholesale Margin</label>
          </p-floatlabel>
        </div>

        <div class="col-md-3">
              <p-floatlabel variant="on">
                 <p-inputNumber
                   inputId="on_Supplier_retailMargin"
                   formControlName="retailMargin"
                   mode="decimal"
                   [minFractionDigits]="0"
                   [maxFractionDigits]="0"
                   autocomplete="off"
                   class="w-full"
                         [ngClass]="{ 'ng-invalid ng-dirty': supplierForm.get('retailMargin')?.invalid && supplierForm.get('retailMargin')?.touched }">
                </p-inputNumber>
             <label for="on_Supplier_retailMargin">Retail Margin</label>
           </p-floatlabel>
        </div>

         <div class="col-md-3">
              <p-floatlabel variant="on">
                 <p-inputNumber
                   inputId="on_Supplier_mrpMargin"
                   formControlName="mrpMargin"
                   mode="decimal"
                   [minFractionDigits]="0"
                   [maxFractionDigits]="0"
                   autocomplete="off"
                   class="w-full"
                         [ngClass]="{ 'ng-invalid ng-dirty': supplierForm.get('mrpMargin')?.invalid && supplierForm.get('mrpMargin')?.touched }">
                </p-inputNumber>
             <label for="on_Supplier_mrpMargin">MRP Margin</label>
           </p-floatlabel>
        </div>

           <div class="col-md-3">
              <p-floatlabel variant="on">
               <p-inputNumber
                 inputId="on_Supplier_paymentDiscount"
                 formControlName="paymentDiscount"
                 mode="currency"
                 currency="INR"
                 locale="en-IN"
                 [minFractionDigits]="0"
                 [maxFractionDigits]="2"
                 autocomplete="off"
                 class="w-full">
              </p-inputNumber>
             <label for="on_Supplier_paymentDiscount">Payment Discount</label>
           </p-floatlabel>
            </div>

            <div class="col-md-3">
               <p-floatlabel variant="on">
            <p-inputNumber
              inputId="on_Supplier_annualIncentive"
              formControlName="annualIncentive"
              mode="decimal"
              suffix="%"
              [minFractionDigits]="0"
              [maxFractionDigits]="2"
              autocomplete="off"
              class="w-full">
           </p-inputNumber>
           <label for="on_Supplier_annualIncentive">Annual Incentive</label>
              </p-floatlabel>
          </div>

         </div>
      </div>
    </div>

    <div class="card mt-3" *ngIf="!isEdit">
       <div class="card-header flex items-center">
       <span class="text-lg font-semibold" style="margin-top: 16px;"> Supplier Master Configuration:</span>
      </div>
      <div class="card-body">
         <div class="row g-3">
           <div class="col-md-4">
            <p-multiselect [options]="(transport$ | async) ?? []" 
                    formControlName="transportIds"
                    optionLabel="name"
                    optionValue="id"
                    placeholder="Select Transport"
                    [maxSelectedLabels]="3"
                    display="chip"
                    class="w-full md:w-80">
            </p-multiselect>
          </div> 
          <div class="col-md-4">
            <p-floatlabel class="w-full">
            <p-select
                 inputId="stockGroup"
                 formControlName="stockGroupId"
                 [options]="(stockGroup$ | async) ?? []"
                 optionLabel="name"
                 optionValue="id"
                 class="w-full">
    </p-select>
    <label for="stockGroup">Select Product Category</label>
  </p-floatlabel>
         </div> 
          <div class="col-md-4">
  <p-floatlabel class="w-full">
    <p-select
        inputId="hsnCode"
        formControlName="hsnCodeId"
        [options]="(hsnCodes$ | async) ?? []"
        optionLabel="name"
        optionValue="id"
        class="w-full"
        [ngClass]="{
          'ng-invalid ng-dirty':
          supplierForm.get('hsnCodeId')?.invalid &&
          supplierForm.get('hsnCodeId')?.touched
        }">
    </p-select>
    <label for="hsnCode">Select HSN Code</label>
  </p-floatlabel>
         </div>
         </div>
      </div>
    </div>

    <div class="card mt-3">
       <div class="card-header flex items-center">
       <span class="text-lg font-semibold" style="margin-top: 16px;">Credit Limits and Days:</span>
      </div>
      <div class="card-body">
         <div class="row g-3">
          <div class="col-md-3">
            <p-floatlabel variant="on">
                 <p-inputNumber
                   inputId="on_Supplier_creditDays"
                   formControlName="creditDays"
                   mode="decimal"
                   [minFractionDigits]="0"
                   [maxFractionDigits]="0"
                   autocomplete="off"
                   class="w-full">
                 </p-inputNumber>
               <label for="on_Supplier_creditDays">Credit Days</label>
            </p-floatlabel>
         </div>

          <div class="col-md-3">
            <p-floatlabel variant="on">
              <p-inputNumber
               inputId="on_Supplier_creditLimit"
               formControlName="creditLimit"
               mode="currency"
               currency="INR"
               locale="en-IN"
               [minFractionDigits]="0"
               [maxFractionDigits]="2"
               autocomplete="off"
               class="w-full">
            </p-inputNumber>
           <label for="on_Supplier_creditLimit">Credit Limits</label>
         </p-floatlabel>
          </div>


          <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Supplier_msmeNumber" formControlName="MSMENumber" autocomplete="off" />
              <label for="on_Supplier_msmeNumber">MSME Number</label>
            </p-floatlabel>
          </div>

          <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Supplier_eccNumber" formControlName="eccNumber" autocomplete="off" />
              <label for="on_Supplier_eccNumber">ECC Number</label>
            </p-floatlabel>
          </div>
         </div>
      </div>
    </div>

     <div class="card mt-3">
       <div class="card-header flex items-center">
       <span class="text-lg font-semibold" style="margin-top: 16px;">Bank Details:</span>
      </div>
      <div class="card-body">
         <div class="row g-3">
          
          <div class="col-md-3">
              <p-floatlabel class="w-full md:w-56" variant="on">
                <p-select formControlName="transactionType" inputId="dtype" [options]="transactionTypes" optionLabel="name" optionValue="value" class="w-full" />
                <label for="dtype">Transaction Type</label>
             </p-floatlabel>
          </div> 

           <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Supplier_upiId" formControlName="UPID" autocomplete="off" />
              <label for="on_Supplier_upiId">UPID</label>
            </p-floatlabel>
          </div>
           <div class="col-md-3">
            <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Supplier_bankName" formControlName="bankName" autocomplete="off" />
              <label for="on_Supplier_bankName">Bank Name</label>
            </p-floatlabel>
          </div>

          <div class="col-md-3">
            <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Supplier_branch" formControlName="branch" autocomplete="off" />
              <label for="on_Supplier_branch">Branch Name</label>
            </p-floatlabel>
          </div>

          <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Supplier_accountNumber" formControlName="accountNumber" autocomplete="off" />
              <label for="on_Supplier_accountNumber">Account Number</label>
            </p-floatlabel>
          </div>

          <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Supplier_ifsc" formControlName="ifsc" autocomplete="off" />
              <label for="on_Supplier_ifsc">IFSC</label>
            </p-floatlabel>
          </div>
         </div>
      </div>
    </div>

     <div class="card mt-3">
       <div class="card-header flex items-center">
       <span class="text-lg font-semibold" style="margin-top: 16px;">Notes:</span>
      </div>
      <div class="card-body">
         <div class="row g-3">
          
           <div class="col-md-12">
            <p-floatlabel variant="on">
              <textarea class="form-control"  pTextarea id="on_label" fluid formControlName="remarks" rows="3" cols="30" style="resize: none" class="h-full"></textarea>
              <label for="on_label">Remark</label>
            </p-floatlabel>
          </div>

         
         </div>
      </div>
    </div>
  </form>
</div>
<p-toast></p-toast>
