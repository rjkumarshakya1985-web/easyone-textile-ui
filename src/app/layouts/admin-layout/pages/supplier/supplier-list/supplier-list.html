<p-toolbar class="page-header">
  <div class="p-toolbar-group-left">
    <p-breadcrumb [model]="breadcrumbItems" homeIcon="pi pi-home"></p-breadcrumb>
  </div>

  <div class="p-toolbar-group-right">
    <p-button label="Add Supplier" class="p-button-sm mr-2"  variant="text" [raised]="true" icon="pi pi-plus" (click)="goToAddSupplier()"/>
    <p-button label="Export" variant="text" icon="pi pi-file-export" [raised]="true" severity="secondary" />
  </div>
</p-toolbar>

<p-card class="app-list-page">
    <div class="d-flex justify-content-between mb-3">

      <div class="flex-grow-1" style="max-width:300px">
        <p-floatlabel variant="on">
          <input pInputText id="on_label" [formControl]="searchControl" autocomplete="off" />
          <label for="on_label">Search keyword</label>
        </p-floatlabel>
      </div>

      <ng-container>
        <p-buttonGroup>
           <p-menu #menuItem [model]="pageSizeItems" [popup]="true" />
           <p-button (click)="menuItem.toggle($event)" label="{{pageSize}}" outlined severity="secondary"></p-button>        
           <p-button label="Total ({{tblResult().totalRows}})" disabled outlined></p-button>
          <p-button icon="pi pi-angle-left" outlined (click)="onPrevious()"></p-button>
          <p-button label="{{ pageindex() + 1 }}/{{ numberofPage() }}" disabled outlined></p-button>
          <p-button icon="pi pi-angle-right" outlined (click)="onNext()"></p-button>
        </p-buttonGroup>
      </ng-container>

    </div>

    <!-- TABLE -->
    <ng-container>    
    <p-table #dt1 [value]="tblResult().result" [lazy]="true"
      (onLazyLoad)="onLazyLoad($event)"
      [sortField]="sortField" [lazyLoadOnInit]="false"
      [sortOrder]="sortOrder" size="small" showGridlines class="p-datatable-sm">
        <ng-template pTemplate="header">
           <tr>
             <th>
                <i class="pi pi-filter-slash cursor-pointer" (click)="clear(dt1)"></i>
            </th>
             <th pSortableColumn="code">
                  <div  class="flex align-items-center gap-2">
                    <span class="header-title">Code</span>&nbsp;
                    <p-sortIcon field="code"></p-sortIcon>
                      <p-columnFilter 
                        type="text"
                        field="code"
                        display="menu"
                        matchMode="equals"
                        [showMatchModes]="false"
                        [showOperator]="false"
                       [showAddButton]="false">
                    </p-columnFilter>
                </div>
             </th>
             <th pSortableColumn="name"> 
                  <div  class="flex align-items-center gap-2">
                    <span class="header-title">Name</span>&nbsp;
                    <p-sortIcon field="name"></p-sortIcon>
                      <p-columnFilter 
                        type="text"
                        field="name"
                        display="menu"
                        matchMode="equals"
                        [showMatchModes]="false"
                        [showOperator]="false"
                       [showAddButton]="false">
                    </p-columnFilter>
                </div>
             </th>
             <th pSortableColumn="agent">
                  <div  class="flex align-items-center gap-2">
                      <span class="header-title">Agent</span>&nbsp;
                     <p-sortIcon field="agent"></p-sortIcon>
                       <p-columnFilter 
                         type="text"
                         field="agent"
                         display="menu"
                         matchMode="equals"
                         [showMatchModes]="false"
                         [showOperator]="false"
                        [showAddButton]="false">
                    </p-columnFilter>
                </div>
             </th>
        <th pSortableColumn="gstIn">
                    <div  class="flex align-items-center gap-2">
                      <span class="header-title">GstIn</span>&nbsp;
                     <p-sortIcon field="gstIn"></p-sortIcon>
                       <p-columnFilter 
                         type="text"
                         field="gstIn"
                         display="menu"
                         matchMode="equals"
                         [showMatchModes]="false"
                         [showOperator]="false"
                        [showAddButton]="false">
                    </p-columnFilter>
                </div>
        </th>
        <th pSortableColumn="userName">
                    <div class="flex items-center gap-2">User Name
                        <p-sortIcon field="userName" />
                    </div>
        </th>
         <th pSortableColumn="password">
                    <div class="flex items-center gap-2">Password
                        <p-sortIcon field="password" />
                    </div>
        </th>
        <th pSortableColumn="address">
                    <div class="flex items-center gap-2">Address
                        <p-sortIcon field="address" />
                    </div>
        </th>
            
            <th class="action-column">Action</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
          <tr [ngClass]="{ 'inactive-row': !row.isActive }">
            <td></td>
            <td>{{row.code}}</td>
            <td>{{ row.name }}</td>
            <td>{{row.agentName}}</td>
            <td>{{row.gstIn}}</td>
            <td>{{row.userName}}</td>
            <td>{{row.password===row.code?'-':row.password}}</td>
            <td>
            <small>{{row.state}},{{row.city}}</small>
            <div>
             <ng-container *ngIf="row.address.length > 15; else shortText">
             <span *ngIf="!row.expanded">
               {{ row.address | slice:0:15 }} 
                <a href="#" (click)="row.expanded = true; $event.preventDefault()">... see more</a>
             </span>
             <span *ngIf="row.expanded">
               {{ row.address }} 
                <a href="#" (click)="row.expanded = false; $event.preventDefault()"> see less</a>
             </span>
           </ng-container>
           <ng-template #shortText>{{ row.address }}</ng-template>
            </div> 
            </td>
            <td class="action-column">
            <span class="px-2 py-1 rounded bg-blue-50 text-blue-600 cursor-pointer hover:bg-blue-100"
              (click)="openMenu($event, row)" pTooltip="Actions">
               <i class="pi pi-ellipsis-v"></i>
           </span>
            </td>
          </tr>
        </ng-template>

      </p-table>
    </ng-container>

</p-card>

<p-menu #menu [model]="items" [popup]="true"></p-menu>
<p-confirmDialog></p-confirmDialog>
