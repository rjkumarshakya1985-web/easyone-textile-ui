<p-toolbar class="page-header">
  <div class="p-toolbar-group-left">
    <p-breadcrumb [model]="breadcrumbItems" homeIcon="pi pi-home"></p-breadcrumb>
  </div>
  <div class="p-toolbar-group-right">
    <p-button label="Add Sales Person" class="p-button-sm mr-2"  variant="text" [raised]="true" icon="pi pi-plus" (click)="openAdd()"/>
    <p-button label="Export" variant="text" icon="pi pi-file-export" [raised]="true" severity="secondary" />
  </div>
</p-toolbar>

<p-card class="app-list-page">
    <div class="d-flex justify-content-between mb-3">

      <div class="flex-grow-1" style="max-width:300px">
        <p-floatlabel variant="on">
          <input pInputText id="on_label" [formControl]="searchControl" autocomplete="off" />
          <label for="on_label">Search keyword</label>
        </p-floatlabel>
      </div>

      <ng-container *ngIf="isLoading()">
        <p-buttonGroup>
          <p-menu #menuItem [model]="pageSizeItems" [popup]="true" />
          <p-button (click)="menuItem.toggle($event)" label="{{pageSize}}" outlined severity="secondary"></p-button>
          <p-button label="Total ({{tblResult().totalRows}})" disabled outlined></p-button>

          <p-button icon="pi pi-angle-left"
            outlined (click)="onPrevious()"></p-button>

          <p-button label="{{ pageindex() + 1 }}/{{ numberofPage() }}"
            disabled outlined></p-button>

          <p-button icon="pi pi-angle-right"
            outlined (click)="onNext()"></p-button>
        </p-buttonGroup>
      </ng-container>

    </div>

    <!-- TABLE -->
    <ng-container *ngIf="isLoading()">
      <p-table [value]="tblResult().result" [lazy]="true"
        scrollable="true"
    scrollHeight="600px"
  (onLazyLoad)="onLazyLoad($event)"
  [sortField]="sortField" [lazyLoadOnInit]="false"
  [sortOrder]="sortOrder" size="small" showGridlines class="p-datatable-sm">

        <ng-template pTemplate="header">
  <tr>
    <th pSortableColumn="name">
      <div class="flex items-center gap-2">
        Name <p-sortIcon field="name" />
      </div>
    </th>

    <th pSortableColumn="phoneNumber">
      <div class="flex items-center gap-2">
        Mobile <p-sortIcon field="phoneNumber" />
      </div>
    </th>

    <th pSortableColumn="email">
      <div class="flex items-center gap-2">
        Email <p-sortIcon field="email" />
      </div>
    </th>

    <th pSortableColumn="stateName">
      <div class="flex items-center gap-2">
        State <p-sortIcon field="stateName" />
      </div>
    </th>

    <th pSortableColumn="cityName">
      <div class="flex items-center gap-2">
        City <p-sortIcon field="cityName" />
      </div>
    </th>

    <th>Address</th>
    <th>Status</th>
    <th>Action</th>
  </tr>
</ng-template>

        <ng-template pTemplate="body" let-row>
  <tr [ngClass]="{ 'inactive-row': !row.isActive }">

    <td>{{ row.name }}</td>
    <td>{{ row.phoneNumber }}</td>
    <td>{{ row.email }}</td>
    <td>{{ row.stateName }}</td>
    <td>{{ row.cityName }}</td>
    <td>{{ row.address }}</td>

    <td>
      <span 
        class="px-2 py-1 rounded"
        [ngClass]="row.isActive ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'">
        {{ row.isActive ? 'Active' : 'Inactive' }}
      </span>
    </td>

    <td>
      <span class="px-2 py-1 rounded bg-blue-50 text-blue-600 cursor-pointer hover:bg-blue-100"
        (click)="openMenu($event, row)">
        <i class="pi pi-ellipsis-v"></i>
      </span>
    </td>

  </tr>
</ng-template>
<p *ngIf="!tblResult().result.length && !isLoading()">
  No sales person found
</p>
      </p-table>
    </ng-container>

</p-card>

<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '40rem' }">
    <ng-template pTemplate="header">
        <div class="inline-flex items-center justify-center gap-2">
            <span class="font-bold whitespace-nowrap">Sales Person</span>
        </div>
    </ng-template>
    
    <form [formGroup]="salesPersonForm">
       

        <div class="flex items-center gap-4 mb-4">
            <label for="name" class="font-semibold w-24 form-label">State</label>
             <p-select formControlName="stateId" inputId="state" [options]="(states$ | async) ?? []" optionLabel="name" optionValue="id" (onChange)="onStateChange($event)" class="w-full" 
                [ngClass]="{ 'ng-invalid ng-dirty': salesPersonForm.get('stateId')?.invalid && salesPersonForm.get('stateId')?.touched }"/>
        </div>

        
        <div class="flex items-center gap-4 mb-4">
            <label for="name" class="font-semibold w-24 form-label">City</label>
             <p-select formControlName="cityId" inputId="state" [options]="(cities$ | async) ?? []" optionLabel="name" optionValue="id"  class="w-full" 
                [ngClass]="{ 'ng-invalid ng-dirty': salesPersonForm.get('cityId')?.invalid && salesPersonForm.get('cityId')?.touched }"/>
        </div>

        <div class="flex items-center gap-4 mb-4">
            <label for="name" class="font-semibold w-24 form-label">Name</label>
            <input pInputText id="name" class="flex-auto" formControlName="name" 
             [ngClass]="{ 'ng-invalid ng-dirty': salesPersonForm.get('name')?.invalid && salesPersonForm.get('name')?.touched }" />
        </div>

         <div class="flex items-center gap-4 mb-4">
            <label for="phoneNumber" class="font-semibold w-24 form-label">Mobile</label>
            <input pInputText id="phoneNumber" class="flex-auto" formControlName="phoneNumber" 
             [ngClass]="{ 'ng-invalid ng-dirty': salesPersonForm.get('phoneNumber')?.invalid && salesPersonForm.get('phoneNumber')?.touched }" />
        </div>
        <div class="flex items-center gap-4 mb-2">
            <label for="email" class="font-semibold w-24 form-label">Email</label>
            <input pInputText id="email" class="flex-auto" formControlName="email" />
        </div>
        <div class="flex items-center gap-4 mb-2">
            <label for="address" class="font-semibold w-24 form-label">Address</label>
            <input pInputText id="address" class="flex-auto" formControlName="address" 
             [ngClass]="{ 'ng-invalid ng-dirty': salesPersonForm.get('address')?.invalid && salesPersonForm.get('address')?.touched }"/>
        </div>
        <div class="flex items-center gap-4 mb-2">
            <label for="status" class="font-semibold w-24 form-label">Status</label>
            <p-checkbox
          binary="true"
          inputId="sg_isgstrule"
          formControlName="isActive">
        </p-checkbox>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <p-button label="Cancel" [raised]="true" (click)="visible = false" severity="secondary" />
        <p-button label="Save" [raised]="true" severity="info" (click)="save()" />
    </ng-template>
</p-dialog>


<p-menu #menu [model]="items" [popup]="true"></p-menu>
<p-confirmDialog></p-confirmDialog>
