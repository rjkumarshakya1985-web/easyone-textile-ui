<p-toolbar class="page-header">
  <div class="p-toolbar-group-left">
    <p-breadcrumb [model]="breadcrumbItems" homeIcon="pi pi-home"></p-breadcrumb>
  </div>

  <div class="p-toolbar-group-right">
   <p-button label="Add Department" class="p-button-sm mr-2"  variant="text" [raised]="true" icon="pi pi-plus" (click)="showDialog()"/>
   <p-button label="Export" variant="text" icon="pi pi-file-export" [raised]="true" severity="secondary" />
  </div>
</p-toolbar>

<p-card>
    <!-- TABLE -->
    <ng-container *ngIf="isLoading()">
        <p-table [value]="tableData()" showGridlines class="p-datatable-sm">

        <ng-template pTemplate="header">
          <tr>
            <th>Name</th>
            <th>Description</th>
            <th class="text-center">Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
          <tr>
            <td>{{ row.name }}</td>
            <td>{{ row.description || '-' }}</td>
            <td class="text-center">
               
            <span class="px-2 py-1 rounded bg-blue-50 text-blue-600 cursor-pointer hover:bg-blue-100"
             (click)="editDepartment(row)" pTooltip="Edit">
            <i class="pi pi-pencil"></i>
           </span>
          
          </td>
          </tr>
        </ng-template>

      </p-table>
    </ng-container>
</p-card>
 <p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '25rem' }">
    <ng-template pTemplate="header">
        <div class="inline-flex items-center justify-center gap-2">
            <span class="font-bold whitespace-nowrap">Department</span>
        </div>
    </ng-template>

    <form [formGroup]="departmentForm">

        <div class="flex items-center gap-4 mb-4">
            <label for="name" class="font-semibold w-24 form-label">Name</label>
            <input pInputText id="name" class="flex-auto" formControlName="name" />

        </div>

        <div class="flex items-center gap-4 mb-2">
            <label for="description" class="font-semibold w-24 form-label">Description</label>
            <input pInputText id="description" class="flex-auto" formControlName="description" />
        </div>

    </form>

    <ng-template pTemplate="footer">
        <p-button label="Cancel" [raised]="true" (click)="visible = false" severity="secondary" />
        <p-button label="Save" [raised]="true" severity="info" (click)="saveDepartment()" />
    </ng-template>
</p-dialog>
