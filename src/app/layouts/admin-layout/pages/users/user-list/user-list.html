<p-toolbar class="page-header">
  <div class="p-toolbar-group-left">
    <p-breadcrumb [model]="breadcrumbItems" homeIcon="pi pi-home"></p-breadcrumb>
  </div>

  <div class="p-toolbar-group-right">    
   <p-button label="Add User" class="p-button-sm mr-2"  variant="text" [raised]="true" icon="pi pi-plus" (click)="showDialog()"/>
   <p-button label="Export" variant="text" icon="pi pi-file-export" [raised]="true" severity="secondary" />
  </div>
</p-toolbar>

<p-card class="app-list-page">
    <div class="d-flex justify-content-between mb-3">

      <div class="flex-grow-1" style="max-width:300px">
         <p-floatlabel variant="on">
          <input pInputText id="on_label" [formControl]="searchControl" autocomplete="off" />
          <label for="on_label">Search keyword</label>
        </p-floatlabel>
      </div>

      <ng-container *ngIf="isLoading()">
        <p-buttonGroup>
          <p-button label="{{pageSize}}" outlined severity="secondary"></p-button>
          <p-button label="Total ({{tblResult().totalRows}})" severity="secondary" disabled outlined></p-button>

          <p-button icon="pi pi-angle-left"
            outlined (click)="onPrevious()" severity="secondary"></p-button>

          <p-button label="{{ pageIndex() + 1 }}/{{ numberOfPages() }}"
            disabled outlined severity="secondary"></p-button>

          <p-button icon="pi pi-angle-right"
            outlined (click)="onNext()" severity="secondary"></p-button>
        </p-buttonGroup>
      </ng-container>

    </div>

    <!-- TABLE -->
    <ng-container *ngIf="isLoading()">
      <p-table [value]="tblResult().result" showGridlines class="p-datatable-sm">

        <ng-template pTemplate="header">
          <tr>
            <th>User Name</th>
            <th>Role</th>
            <th>Password</th>

            <th>Email</th>
            <th>Phone</th>
            <th>Developer</th>
            <th class="text-center action-column">Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
          <tr [ngClass]="{ 'inactive-row': !row.isActive }">
            <td>{{ row.userName }}</td>
            <td>{{getUserRole(row.role)}}</td>
            <td>{{row.password}}</td>
            <td>{{row.email}}</td>
            <td>{{row.phone}}</td>
            <td>
              <span class="developer-badge" [class.active]="row.isDeveloper">
                {{ row.isDeveloper ? 'Yes' : 'No' }}
              </span>
            </td>
            <td class="text-center action-column">
              <span class="px-2 py-1 rounded bg-blue-50 text-blue-600 cursor-pointer hover:bg-blue-100"
               (click)="editUser(row)" pTooltip="Edit">
                <i class="pi pi-pencil"></i>
             </span>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="7">
              <div class="table-empty-state">
                <i class="pi pi-inbox"></i>
                <span>No records found</span>
              </div>
            </td>
          </tr>
        </ng-template>

      </p-table>
    </ng-container>

</p-card>

<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '40rem' }">
    <ng-template pTemplate="header">
        <div class="inline-flex items-center justify-center gap-2">
            <span class="font-bold whitespace-nowrap">User Management</span>
        </div>
    </ng-template>
    
    <form [formGroup]="userForm">
       <div class="flex items-center gap-4 mb-4">
            <label for="userName" class="font-semibold w-24 form-label">Select Role</label>
             <p-select
                 formControlName="roleId"
                 [options]="roleTypes"
                 optionLabel="name"
                class="flex-auto" optionValue="value"
                [ngClass]="{ 'ng-invalid ng-dirty': userForm.get('roleId')?.invalid && userForm.get('roleId')?.touched }">
              </p-select>
        </div>

         <div class="flex items-center gap-4 mb-4" *ngIf="userForm.get('roleId')?.value == 4">
            <label for="department" class="font-semibold w-24 form-label">Department</label>
              <p-select formControlName="departmentId" inputId="department"   class="flex-auto"
                 [options]="(department$ | async) ?? []" optionLabel="name" optionValue="id"
                  [ngClass]="{ 'ng-invalid ng-dirty': userForm.get('departmentId')?.invalid && userForm.get('departmentId')?.touched }">
              </p-select>
        </div>

        <div class="flex items-center gap-4 mb-4">
            <label for="userName" class="font-semibold w-24 form-label">User Name</label>
            <input pInputText id="userName" class="flex-auto" formControlName="userName" 
             [ngClass]="{ 'ng-invalid ng-dirty': userForm.get('userName')?.invalid && userForm.get('userName')?.touched }" />
        </div>

        <div class="flex items-center gap-4 mb-4">
            <label for="password" class="font-semibold w-24 form-label">Password</label>
            <input pInputText id="password" class="flex-auto" formControlName="password"
            [ngClass]="{ 'ng-invalid ng-dirty': userForm.get('password')?.invalid && userForm.get('password')?.touched }" />
        </div>

        <div class="flex items-center gap-4 mb-2">
            <label for="email" class="font-semibold w-24 form-label">Email</label>
            <input pInputText id="email" class="flex-auto" formControlName="email" />
        </div>

         <div class="flex items-center gap-4 mb-2">
            <label for="phone" class="font-semibold w-24 form-label">Phone</label>
            <input pInputText id="phone" class="flex-auto" formControlName="phone" />
        </div>

        
        <div class="flex items-center gap-4 mb-2">
            <label for="phone" class="font-semibold w-24 form-label">Status</label>
            <p-checkbox
          binary="true"
          inputId="sg_isgstrule"
          formControlName="isActive">
        </p-checkbox>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <p-button label="Cancel" [raised]="true" (click)="visible = false" severity="secondary" />
        <p-button label="Save" [raised]="true" severity="info" (click)="submit()" />
    </ng-template>
</p-dialog>
