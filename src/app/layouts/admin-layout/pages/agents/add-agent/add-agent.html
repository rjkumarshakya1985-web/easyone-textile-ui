<div class="container mt-4">
  <form [formGroup]="agentForm" (ngSubmit)="submit()">

    <div class="card">
     <div class="card-header flex items-center">
     <span class="text-lg font-semibold" style="margin-top: 16px;">Agent Information</span>
       <p-button type="submit"
        label="Save Agent" 
        class="p-button-sm ml-auto"  
        variant="text" 
        [raised]="true">
      </p-button>
    </div>
      <div class="card-body">
         <div class="row g-3"> 
          <!-- Name -->
          <div class="col-md-3">
            <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Agent_name" formControlName="name"  autocomplete="off"
               [ngClass]="{ 'ng-invalid ng-dirty': agentForm.get('name')?.invalid && agentForm.get('name')?.touched }"  />
              <label for="on_Agent_name">Name</label>
            </p-floatlabel>
          </div>

          <!-- Alias -->
          <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Agent_cperson" formControlName="contactPersonName" autocomplete="off" 
              [ngClass]="{ 'ng-invalid ng-dirty': agentForm.get('contactPersonName')?.invalid && agentForm.get('contactPersonName')?.touched }" />
              <label for="on_Agent_cperson">Contact Person</label>
            </p-floatlabel>  
          </div>
         <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Agent_mobile" formControlName="contactPersonMobile" autocomplete="off" 
              [ngClass]="{ 'ng-invalid ng-dirty': agentForm.get('contactPersonMobile')?.invalid && agentForm.get('contactPersonMobile')?.touched }"/>
              <label for="on_Agent_mobile">Mobile</label>
            </p-floatlabel>
          </div>
          <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Agent_email" formControlName="email" autocomplete="off" />
              <label for="on_Agent_email">Email</label>
            </p-floatlabel>
          </div>
           <div class="col-md-3">
            <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Agent_gstIn" formControlName="gstin" autocomplete="off" />
              <label for="on_Agent_gstIn">GSTIN</label>
            </p-floatlabel>
          </div>
          <!-- PAN -->
          <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Agent_pan" formControlName="pan" autocomplete="off" />
              <label for="on_Agent_pan">PAN</label>
            </p-floatlabel>
          </div>

          <!-- City, State, Pin -->
          <div class="col-md-3">
             <p-floatlabel class="w-full md:w-56" variant="on">
                <p-select formControlName="stateId" inputId="state" [options]="(states$ | async) ?? []" optionLabel="name" optionValue="id" (onChange)="onStateChange($event)" class="w-full" />
                <label for="state">Select State</label>
             </p-floatlabel>
          </div>

          <div class="col-md-3">
            <p-floatlabel class="w-full md:w-56" variant="on">
                <p-select formControlName="cityId" inputId="city" [options]="(cities$ | async) ?? []" optionLabel="name" optionValue="id"  class="w-full" />
                <label for="city">Select City</label>
             </p-floatlabel>
          </div>  
           <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Agent_area" formControlName="area" autocomplete="off" />
              <label for="on_Agent_area">AREA</label>
            </p-floatlabel>
          </div>  
          <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Agent_pin" formControlName="pincode" autocomplete="off" />
              <label for="on_Agent_pin">PIN CODE</label>
            </p-floatlabel>
          </div>  
           <div class="col-md-3">
             <p-floatlabel variant="on">
              <input pInputText class="form-control" id="on_Agent_tallyname" formControlName="tallyLedgerName" autocomplete="off" />
              <label for="on_Agent_tallyname">TALLY LEDGER NAME</label>
            </p-floatlabel>
          </div>      
         
           <!-- Price Type -->
          
         
          
           <!-- Address -->
          <div class="col-md-12">
             <p-floatlabel variant="on">
              <textarea class="form-control"  pTextarea id="on_address" fluid formControlName="address" rows="3" cols="30" style="resize: none" class="h-full"></textarea>
              <label for="on_address">Address</label>
            </p-floatlabel>
          </div>

        </div>
      </div>
    </div> 
  </form>
</div>
<p-toast></p-toast>
