<p-toolbar class="page-header">
  <div class="p-toolbar-group-left">
    <p-breadcrumb [model]="breadcrumbItems" homeIcon="pi pi-home"></p-breadcrumb>
  </div>

  <div class="p-toolbar-group-right">
    <p-button label="Add Agent" class="p-button-sm mr-2"  variant="text" [raised]="true" icon="pi pi-plus" (click)="goToAddAgent()"/>
    <p-button label="Export" variant="text" icon="pi pi-file-export" [raised]="true" severity="secondary" />
  </div>
</p-toolbar>

<p-card>
    <div class="d-flex justify-content-between mb-3">

      <div class="flex-grow-1" style="max-width:300px">
        <p-floatlabel variant="on">
          <input pInputText id="on_label" [formControl]="searchControl" autocomplete="off" />
          <label for="on_label">Search keyword</label>
        </p-floatlabel>
      </div>

      <ng-container *ngIf="isLoading()">
        <p-buttonGroup>
          <!-- <p-button label="{{pageSize}}" outlined severity="secondary"></p-button> -->
           <p-menu #menuItem [model]="pageSizeItems" [popup]="true" />
          <p-button (click)="menuItem.toggle($event)" label="{{pageSize}}" outlined severity="secondary"></p-button>        
          <p-button label="Total ({{tblResult().totalRows}})" disabled outlined></p-button>

          <p-button icon="pi pi-angle-left"
            outlined (click)="onPrevious()"></p-button>

          <p-button label="{{ pageindex() + 1 }}/{{ numberofPage() }}"
            disabled outlined></p-button>

          <p-button icon="pi pi-angle-right"
            outlined (click)="onNext()"></p-button>
        </p-buttonGroup>
      </ng-container>

    </div>

    <!-- TABLE -->
    <ng-container *ngIf="isLoading()">
      <!-- <p-table [value]="tblResult().result" size="small" showGridlines class="p-datatable-sm"> -->
 <p-table [value]="tblResult().result" [lazy]="true"
  (onLazyLoad)="onLazyLoad($event)"
  [sortField]="sortField" [lazyLoadOnInit]="false"
  [sortOrder]="sortOrder" size="small" showGridlines class="p-datatable-sm">

     
        <ng-template pTemplate="header">
           <tr>
        <th pSortableColumn="agentName">
          <div class="supplier-header">
              <span class="header-title">Agent</span>&nbsp;
              <p-sortIcon field="agentName"></p-sortIcon>
                 </div>
       </th>
        <th pSortableColumn="contactPersonName">
                    <div class="flex items-center gap-2">Contact Person
                        <p-sortIcon field="contactPersonName" />
                    </div>
        </th>
           <th pSortableColumn="contactPersonMobile">
                    <div class="flex items-center gap-2">Phone
                        <p-sortIcon field="contactPersonMobile" />
                    </div>
        </th>
              <th pSortableColumn="gstin">
                    <div class="flex items-center gap-2">GST No.
                        <p-sortIcon field="gstin" />
                    </div>
        </th>
             <th pSortableColumn="pan">
                    <div class="flex items-center gap-2">Pan No.
                        <p-sortIcon field="pan" />
                    </div>
        </th>
        <th pSortableColumn="tallyLedgerName">
                    <div class="flex items-center gap-2">Tally Name
                        <p-sortIcon field="tallyLedgerName" />
                    </div>
        </th>
        <th pSortableColumn="address">
                    <div class="flex items-center gap-2">Address
                        <p-sortIcon field="address" />
                    </div>
        </th>
            
            <th>Action</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
          <tr [ngClass]="{ 'inactive-row': !row.isActive }">
            <td>{{row.agentName}}</td>
            <td>{{ row.contactPersonName }}</td>
            <td>{{row.contactPersonMobile}}</td>
            <td>{{row.gstIn}}</td>
            <td>{{row.pan}}</td>
            <td>{{row.tallyLedgerName}}</td>
            <td>
            <small>{{row.state}},{{row.city}}</small>
            <div><small>{{row.address}}</small></div> 
            </td>
            <td>
            <span class="px-2 py-1 rounded bg-blue-50 text-blue-600 cursor-pointer hover:bg-blue-100"
              (click)="openMenu($event, row)" pTooltip="Actions">
               <i class="pi pi-ellipsis-v"></i>
           </span>
            </td>
          </tr>
        </ng-template>

      </p-table>
    </ng-container>

</p-card>

<p-menu #menu [model]="items" [popup]="true"></p-menu>
<p-confirmDialog></p-confirmDialog>
