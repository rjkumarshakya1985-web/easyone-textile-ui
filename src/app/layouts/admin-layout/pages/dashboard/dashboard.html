<div class="dashboard-container">

<div class="row g-3" style="margin-bottom: 20px;">
  <div class="col-md-3" *ngFor="let c of cards">

    <div class="card shadow-sm h-100">

      <!-- Header -->
      <div class="card-body d-flex align-items-center gap-3">
        <div
          class="d-flex justify-content-center align-items-center rounded-circle text-white"
          [ngStyle]="{ 'background': c.color, width: '40px', height: '40px' }">
          <i [class]="c.icon" style="font-size: 18px;"></i>
        </div>

        <h6 class="card-title mb-0">{{ c.title }}</h6>
        
      </div>

      <!-- Value -->
      <div class="card-body pt-0 text-center">
        <div class="text-surface-900 dark:text-surface-0 font-medium text-xl">{{c.value}}</div>
      </div>

      <hr class="my-0" />

      <!-- Footer -->
      <div class="card-body py-2">
        <a href="#" class="text-primary" style="font-size: 14px;">
          <i class="bi bi-send"></i> Go to List
        </a>
      </div>

    </div>

  </div>
</div>

  <div class="tables">
    <div class="table-card purple">
      <h4>Enter Parcel</h4>
      <p>New parcel entered on {{ date | date:'longDate' }}</p>
      <p-table [value]="readyParcels" responsiveLayout="scroll" style="font-size:11px;">
        <ng-template pTemplate="header">
          <tr>
            <th>Parcel no.</th>
            <th>Date</th>
            <th>Transport</th>
            <th>Quantity</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr>
            <td>{{ row.no }}</td>
            <td>{{ row.date }}</td>
            <td>{{ row.transport }}</td>
            <td>{{ row.qty }}</td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <div class="table-card red">
      <h4>Open Parcel</h4>
      <p>New parcel open on {{ date | date:'longDate' }}</p>
      <p-table [value]="[]" responsiveLayout="scroll" style="font-size:11px;">
        <ng-template pTemplate="header">
          <tr>
            <th>Parcel no.</th>
            <th>Date</th>
            <th>Transport</th>
            <th>Quantity</th>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
